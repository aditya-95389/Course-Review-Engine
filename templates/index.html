<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CourseHub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:#333}
.nav{background:rgba(255,255,255,0.9);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px)}
.nav h1{color:#667eea;font-size:1.8rem}
.nav div{display:flex;gap:1rem;align-items:center}
.nav a{color:#333;text-decoration:none;padding:0.5rem 1rem;border-radius:8px;transition:background 0.3s}
.nav a:hover{background:rgba(102,126,234,0.1)}
.container{max-width:1200px;margin:0 auto;padding:2rem}
.hero{text-align:center;color:white;margin:3rem 0}
.hero h2{font-size:3rem;margin-bottom:1rem}
.search{display:flex;justify-content:center;gap:0.5rem;margin:2rem 0}
.search input{padding:1rem;width:400px;border:none;border-radius:25px;font-size:1rem}
.search button{padding:1rem 2rem;background:#28a745;color:white;border:none;border-radius:25px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:2rem;margin:2rem 0}
.card{background:rgba(255,255,255,0.95);padding:2rem;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);transition:transform 0.3s}
.card:hover{transform:translateY(-5px)}
.card h3{color:#333;margin-bottom:1rem;font-size:1.3rem}
.card h3 a{color:inherit;text-decoration:none}
.provider{color:#667eea;font-weight:bold;margin-bottom:1rem}
.desc{color:#666;line-height:1.6;margin-bottom:1rem}
.rating{color:#f39c12;font-size:1.1rem}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:1000}
.modal-content{background:white;padding:3rem;border-radius:15px;width:90%;max-width:500px;position:relative}
.close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;cursor:pointer}
.form input,textarea{width:100%;padding:1rem;margin:0.5rem 0;border:2px solid #eee;border-radius:8px;font-size:1rem}
.form button{width:100%;padding:1rem;background:#667eea;color:white;border:none;border-radius:8px;font-size:1.1rem;cursor:pointer;margin-top:1rem}
.stars{display:flex;gap:0.25rem;margin:1rem 0;justify-content:center}
.stars input{display:none}
.stars label{font-size:2rem;color:#ddd;cursor:pointer}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#f39c12}
.review{border:1px solid #eee;padding:1.5rem;margin:1rem 0;border-radius:8px;background:#f9f9f9}
.review-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.review button{padding:0.5rem 1rem;border:none;border-radius:4px;cursor:pointer;color:white;background:#007bff;margin-left:0.5rem}
.hide{display:none}
.section{margin:3rem 0}
.section h2{color:white;text-align:center;margin-bottom:2rem;font-size:2rem}
</style>
</head>
<body>
<nav class="nav">
<h1>🎓 CourseHub</h1>
<div id="nav"></div>
</nav>

<div class="container">
<div class="hero">
<h2>Discover Amazing Courses</h2>
<p>Learn from world-class instructors</p>
</div>

<div class="search">
<input id="searchInput" placeholder="Search courses...">
<button onclick="search()">Search</button>
</div>

<div class="section">
<h2>All Courses</h2>
<div id="loadingIndicator" style="text-align:center;color:white;font-size:1.2rem;margin:2rem 0">
🔄 Loading courses...
</div>
<div class="grid" id="courses"></div>
</div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal hide">
<div class="modal-content">
<button class="close" onclick="closeModal()">&times;</button>
<h2>Login</h2>
<div class="form">
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p><a href="#" onclick="switchModal('register')">Register</a> | <a href="#" onclick="switchModal('forgot')">Forgot Password?</a></p>
</div>
</div>
</div>

<!-- Register Modal -->
<div id="registerModal" class="modal hide">
<div class="modal-content">
<button class="close" onclick="closeModal()">&times;</button>
<h2>Register</h2>
<div class="form">
<input id="registerEmail" type="email" placeholder="Email">
<input id="registerPassword" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<p><a href="#" onclick="switchModal('login')">Login</a></p>
</div>
</div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotModal" class="modal hide">
<div class="modal-content">
<button class="close" onclick="closeModal()">&times;</button>
<h2>Forgot Password</h2>
<div class="form">
<input id="forgotEmail" type="email" placeholder="Email">
<button onclick="forgotPassword()">Send Reset Token</button>
<p><a href="#" onclick="switchModal('login')">Back to Login</a></p>
</div>
</div>
</div>

<!-- Reset Password Modal -->
<div id="resetModal" class="modal hide">
<div class="modal-content">
<button class="close" onclick="closeModal()">&times;</button>
<h2>Reset Password</h2>
<div class="form">
<input id="resetToken" type="text" placeholder="Reset Token">
<input id="newPassword" type="password" placeholder="New Password">
<button onclick="resetPassword()">Reset Password</button>
<p><a href="#" onclick="switchModal('login')">Back to Login</a></p>
</div>
</div>
</div>

<!-- Course Detail Modal -->
<div id="courseModal" class="modal hide">
<div class="modal-content" style="max-width:800px;max-height:80vh;overflow-y:auto">
<button class="close" onclick="closeModal()">&times;</button>
<div id="courseDetail"></div>
</div>
</div>

<script defer src="https://unpkg.com/@vercel/analytics@1/dist/web/script.js"></script>
<script>
// Initialize Vercel Analytics
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>

<script>
let user = null;
let allCourses = [];

function msg(text) {
const div = document.createElement('div');
div.style.cssText = 'position:fixed;top:20px;right:20px;background:#28a745;color:white;padding:1rem;border-radius:8px;z-index:2000';
div.textContent = text;
document.body.appendChild(div);
setTimeout(() => div.remove(), 3000);
}

function updateNav() {
document.getElementById('nav').innerHTML = user ? 
`<span>👋 ${user.email}</span><a href="#" onclick="logout()">Logout</a>` :
`<a href="#" onclick="showModal('login')">Login</a><a href="#" onclick="showModal('register')">Register</a>`;
}

function showModal(type) {
document.getElementById(type + 'Modal').classList.remove('hide');
}


function closeModal() {
document.querySelectorAll('.modal').forEach(m => m.classList.add('hide'));
}

function switchModal(type) {
closeModal();
showModal(type);
}

async function api(url, data) {
const res = await fetch('/api' + url, {
method: data ? 'POST' : 'GET',
headers: {'Content-Type': 'application/json'},
body: data ? JSON.stringify(data) : null
});
return await res.json();
}

async function login() {
const res = await api('/auth', {
email: document.getElementById('loginEmail').value,
password: document.getElementById('loginPassword').value
});
if (res.ok) {
user = res.user;
updateNav();
closeModal();
msg('Login successful!');

// Track login event
if (window.va) window.va('track', 'Login', { method: 'email' });
} else {
msg(res.msg || 'Login failed');
// Track failed login
if (window.va) window.va('track', 'Login Failed');
}
}


async function register() {
const res = await api('/auth', {
email: document.getElementById('registerEmail').value,
password: document.getElementById('registerPassword').value,
register: true
});
if (res.ok) {
msg('Registration successful! Please login.');
// Track successful registration
if (window.va) window.va('track', 'Registration', { method: 'email' });
switchModal('login');
} else {
msg(res.msg || 'Registration failed');
// Track failed registration
if (window.va) window.va('track', 'Registration Failed');
}
}

async function logout() {
user = null;
updateNav();
msg('Logged out');
}

async function forgotPassword() {
const email = document.getElementById('forgotEmail').value;
if (!email) {
msg('Please enter your email');
return;
}

const res = await api('/forgot-password', { email });
if (res.ok) {
if (res.token) {
msg(`Reset token: ${res.token}`);
document.getElementById('resetToken').value = res.token;
} else {
msg('Reset token sent to your email! Check your inbox.');
}
switchModal('reset');
} else {
msg(res.msg || 'Failed to send reset token');
}
}

async function resetPassword() {
const token = document.getElementById('resetToken').value.trim();
const password = document.getElementById('newPassword').value;

console.log('Reset attempt with token:', token);
console.log('Token length:', token.length);

if (!token || !password) {
msg('Please fill all fields');
return;
}

const res = await api('/reset-password', { token, password });
if (res.ok) {
msg('Password reset successful! Please login.');
switchModal('login');
} else {
msg(res.msg || 'Failed to reset password');
console.log('Reset failed:', res);
}
}

function stars(rating, count = 0) {
if (!rating) return `<span style="color:#999">No reviews yet</span>`;
return `<span style="color:#f39c12">${'⭐'.repeat(Math.round(rating))}</span> ${rating.toFixed(1)} (${count} reviews)`;
}

async function loadCourses() {
const courses = await api('/courses');
allCourses = courses;
displayCourses(courses);
}

function displayCourses(courses) {
// Hide loading indicator
document.getElementById('loadingIndicator').style.display = 'none';

document.getElementById('courses').innerHTML = courses.map(c => `
<div class="card">
<h3><a href="#" onclick="showCourse(${c.id})">${c.name}</a></h3>
<div class="provider">${c.provider}</div>
<div class="desc">${c.desc}</div>
<div class="rating">${stars(c.avg, c.cnt)}</div>
</div>
`).join('');
}

async function search() {
const q = document.getElementById('searchInput').value;
// Track search event
if (q && window.va) window.va('track', 'Search', { query: q });
const courses = q ? await api('/courses?search=' + encodeURIComponent(q)) : allCourses;
displayCourses(courses);
}

async function showCourse(id) {
console.log('Loading course:', id);
const data = await api('/courses/' + id);
console.log('Course data received:', data);

if (!data || data.error) {
msg('Failed to load course details');
return;
}

const course = data.course;
const reviews = data.reviews || [];
const avg = data.avg;

if (!course) {
msg('Course not found');
return;
}

document.getElementById('courseDetail').innerHTML = `
<h2>${course.name}</h2>
<div class="provider">${course.provider}</div>
<p style="margin:1rem 0">${course.desc}</p>
<div class="rating" style="margin:1rem 0">${stars(avg, reviews.length)}</div>
<a href="${course.url}" target="_blank" style="display:inline-block;background:#667eea;color:white;padding:1rem 2rem;text-decoration:none;border-radius:8px;margin:1rem 0">Visit Course</a>

${user ? `
<div style="background:#f9f9f9;padding:2rem;border-radius:8px;margin:2rem 0">
<h3>Write Review</h3>
<div class="stars">
<input type="radio" name="rating" value="5" id="s5"><label for="s5">⭐</label>
<input type="radio" name="rating" value="4" id="s4"><label for="s4">⭐</label>
<input type="radio" name="rating" value="3" id="s3"><label for="s3">⭐</label>
<input type="radio" name="rating" value="2" id="s2"><label for="s2">⭐</label>
<input type="radio" name="rating" value="1" id="s1"><label for="s1">⭐</label>
</div>
<textarea id="reviewText" placeholder="Write your review..." rows="4"></textarea>
<button onclick="submitReview(${id})" style="background:#28a745;color:white;border:none;padding:1rem 2rem;border-radius:8px;cursor:pointer">Submit Review</button>
</div>
` : `
<div style="text-align:center;padding:2rem;background:#f9f9f9;border-radius:8px;margin:2rem 0">
<p>Login to write a review</p>
<button onclick="showModal('login')" style="background:#667eea;color:white;border:none;padding:1rem 2rem;border-radius:8px;cursor:pointer;margin-top:1rem">Login</button>
</div>
`}

<h3 style="margin:2rem 0 1rem 0">Reviews</h3>
${reviews.length ? reviews.map(r => `
<div class="review" id="review-${r.id}">
<div class="review-header">
<strong>${r.email}</strong>
<span style="color:#f39c12">${'⭐'.repeat(r.rating)}</span>
${data.current_user_id === r.user_id ? `
<div style="margin-left:auto;display:flex;gap:0.5rem">
<button onclick="editReview(${r.id}, ${r.rating}, \`${r.text}\`)">Edit</button>
<button onclick="deleteReview(${r.id})" style="background:#dc3545">Delete</button>
</div>
` : ''}
</div>
<p id="review-text-${r.id}">${r.text}</p>
<div id="edit-form-${r.id}" class="hide">
<div class="stars">
<input type="radio" name="edit-rating-${r.id}" value="5" id="e5-${r.id}"><label for="e5-${r.id}">⭐</label>
<input type="radio" name="edit-rating-${r.id}" value="4" id="e4-${r.id}"><label for="e4-${r.id}">⭐</label>
<input type="radio" name="edit-rating-${r.id}" value="3" id="e3-${r.id}"><label for="e3-${r.id}">⭐</label>
<input type="radio" name="edit-rating-${r.id}" value="2" id="e2-${r.id}"><label for="e2-${r.id}">⭐</label>
<input type="radio" name="edit-rating-${r.id}" value="1" id="e1-${r.id}"><label for="e1-${r.id}">⭐</label>
</div>
<textarea id="edit-text-${r.id}" rows="3">${r.text}</textarea>
<div style="margin-top:1rem">
<button onclick="saveEdit(${r.id})" style="background:#28a745">Save</button>
<button onclick="cancelEdit(${r.id})" style="background:#6c757d;margin-left:0.5rem">Cancel</button>
</div>
</div>
</div>
`).join('') : '<p style="color:#666;font-style:italic">No reviews yet. Be the first!</p>'}
`;

// Track course view
if (window.va) window.va('track', 'Course View', { courseId: id, courseName: course.name });

showModal('course');
}

async function submitReview(courseId) {
const rating = document.querySelector('input[name="rating"]:checked')?.value;
const text = document.getElementById('reviewText').value;

if (!rating) {
msg('Please select a rating');
return;
}

const res = await api('/reviews', {
course_id: courseId,
rating: parseInt(rating),
text: text
});

if (res.ok) {
msg('Review submitted!');
// Track review submission
if (window.va) window.va('track', 'Review Submitted', { courseId: courseId, rating: parseInt(rating) });
showCourse(courseId);
} else {
msg('Failed to submit review');
// Track failed review
if (window.va) window.va('track', 'Review Submission Failed');
}
}

function editReview(reviewId, currentRating, currentText) {
const textEl = document.getElementById(`review-text-${reviewId}`);
const formEl = document.getElementById(`edit-form-${reviewId}`);
const ratingEl = document.querySelector(`input[name="edit-rating-${reviewId}"][value="${currentRating}"]`);
const textAreaEl = document.getElementById(`edit-text-${reviewId}`);

if (textEl) textEl.classList.add('hide');
if (formEl) formEl.classList.remove('hide');
if (ratingEl) ratingEl.checked = true;
if (textAreaEl) textAreaEl.value = currentText;
}

function cancelEdit(reviewId) {
document.getElementById(`review-text-${reviewId}`).classList.remove('hide');
document.getElementById(`edit-form-${reviewId}`).classList.add('hide');
}

async function saveEdit(reviewId) {
const rating = document.querySelector(`input[name="edit-rating-${reviewId}"]:checked`)?.value;
const text = document.getElementById(`edit-text-${reviewId}`).value;

if (!rating) {
msg('Please select a rating');
return;
}

const res = await fetch(`/api/reviews/${reviewId}`, {
method: 'PUT',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({rating: parseInt(rating), text: text})
});

const result = await res.json();
if (result.ok) {
msg('Review updated!');
const courseId = new URLSearchParams(window.location.search).get('course') || 1;
showCourse(courseId);
} else {
msg('Failed to update review');
}
}

async function deleteReview(reviewId) {
if (!confirm('Delete this review?')) return;

const res = await fetch(`/api/reviews/${reviewId}`, {method: 'DELETE'});

if (res.ok) {
msg('Review deleted!');
document.getElementById(`review-${reviewId}`).remove();
} else {
msg('Failed to delete review');
}
}


async function init() {
// Load courses immediately for better UX
const res = await api('/user');
if (res.user) user = res.user;
updateNav();
loadCourses();
}

document.getElementById('searchInput').addEventListener('keypress', e => {
if (e.key === 'Enter') search();
});

init();
</script>
</body>
</html>
